<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Iniciar sesión — SEOTracker</title>
<link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
<script>
  // Evitar parpadeo aplicando el tema de forma síncrona
  const storedTheme = localStorage.getItem('theme') || 'light';
  document.documentElement.setAttribute('data-theme', storedTheme);
</script>
</head>
<body class="login-page">
  <button id="theme-toggle" class="btn btn-outline" aria-label="Cambiar tema" style="position: absolute; top: 20px; right: 20px; padding: 6px; display: flex; align-items: center; justify-content: center; border-radius: 50%; width: 36px; height: 36px; background: var(--bg-card); z-index: 1000;">
    <!-- Sol (icono de luz, se muestra en tema oscuro) -->
    <svg id="theme-toggle-light-icon" style="display: none; width: 18px; height: 18px;" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="5"></circle><line x1="12" y1="1" x2="12" y2="3"></line><line x1="12" y1="21" x2="12" y2="23"></line><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line><line x1="1" y1="12" x2="3" y2="12"></line><line x1="21" y1="12" x2="23" y2="12"></line><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line></svg>
    <!-- Luna (icono de oscuridad, se muestra en tema claro) -->
    <svg id="theme-toggle-dark-icon" style="display: none; width: 18px; height: 18px;" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path></svg>
  </button>
  <div class="login-card">
    <div class="login-logo">
      <div style="display: flex; flex-direction: column; align-items: center; gap: 12px; margin-bottom: 8px;">
        <img src="{{ url_for('static', filename='img/logo.png') }}" alt="Logo" style="height: 64px; width: 64px; object-fit: contain;">
        <h1 style="margin: 0;">SEOTracker</h1>
      </div>
      <p>Panel de auditoría automatizada</p>
    </div>

    {% with messages = get_flashed_messages(with_categories=true) %}
      {% if messages %}
        <div class="flash-list" style="margin-bottom:16px;">
          {% for cat, msg in messages %}
            <div class="flash flash-{{ cat }}">{{ msg }}</div>
          {% endfor %}
        </div>
      {% endif %}
    {% endwith %}

    <form method="POST" action="{{ url_for('login') }}">
      <div class="form-group">
        <label for="email">Correo Electrónico</label>
        <input type="email" id="email" name="email" placeholder="usuario@empresa.com" required autofocus>
      </div>
      <div class="form-group">
        <label for="password">Contraseña</label>
        <input type="password" id="password" name="password" placeholder="••••••••" required>
      </div>
      <button type="submit" class="btn btn-primary login-btn">Iniciar sesión</button>
    </form>
  </div>
  <script src="{{ url_for('static', filename='js/main.js') }}"></script>
</body>
</html>

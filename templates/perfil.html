{% extends "base.html" %}
{% block title %}Mi Perfil — SEOTracker{% endblock %}
{% block page_title %}Mi Perfil{% endblock %}

{% block content %}
<div class="form-card" style="max-width: 500px;">
  <form method="POST">
    <div class="form-grid" style="grid-template-columns: 1fr;">

      <div class="form-group">
        <label>Correo Electrónico (Solo Lectura)</label>
        <input type="email" value="{{ current_user.email }}" readonly disabled style="background-color: var(--bg-hover);">
      </div>

      <div class="form-group">
        <label for="username">Nombre de Usuario</label>
        <input type="text" id="username" name="username" value="{{ current_user.username }}" required>
      </div>

      <div class="form-group">
        <label for="password">Nueva Contraseña</label>
        <input type="password" id="password" name="password" placeholder="Deja en blanco para no cambiarla" autocomplete="new-password">
        <span class="hint">Escribe una nueva contraseña solo si deseas cambiarla.</span>
      </div>

    </div>

    <div style="display:flex;gap:12px;margin-top:24px;justify-content:flex-end;">
      <a href="{{ url_for('dashboard') }}" class="btn btn-outline">Cancelar</a>
      <button type="submit" class="btn btn-primary">Guardar Cambios</button>
    </div>
  </form>
</div>
{% endblock %}
